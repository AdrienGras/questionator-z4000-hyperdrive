# Analyse SonarQube Cloud lancée par la CI (F42, job « check » de ci.yml), après `pnpm test:coverage`.
sonar.projectKey=AdrienGras_questionator-z4000-hyperdrive
sonar.organization=adriengras

# Tout le dépôt est analysé (code, scripts, configs, workflows), les tests à part.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**
# src/routeTree.gen.ts est généré par le plugin TanStack Router (non modifiable à la main).
# src/components/ui/ est du code vendu par le CLI shadcn, réécrit à chaque `add --overwrite` (D53).
# Les tests sont exclus des sources : un fichier ne peut pas être à la fois source et test.
sonar.exclusions=src/routeTree.gen.ts,src/components/ui/**,**/*.test.ts,**/*.test.tsx,e2e/**,dist/**,coverage/**
# Les dictionnaires fr et en ont la même structure par construction : Dictionary<P> impose la parité des clés. Sonar ignore les littéraux et signale toujours le fichier (D61).
sonar.cpd.exclusions=src/lib/i18n/ui-messages.ts,src/domain/export/messages.ts

# Couverture des tests Vitest. Seuls src/, scripts/ et vite/ sont mesurés, sans l'outillage de test
# ni les déclarations : mêmes exclusions que `test.coverage` (vite.config.ts) et `ignore` (codecov.yml).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.d.ts,src/testing/**,site/**,*.config.ts,*.cjs
