# Analyse automatique SonarQube Cloud.
# src/routeTree.gen.ts est généré par le plugin TanStack Router (non modifiable à la main).
# src/components/ui/ est du code vendu par le CLI shadcn, réécrit à chaque `add --overwrite` (D53).
sonar.exclusions=src/routeTree.gen.ts,src/components/ui/**
# Les dictionnaires fr et en ont la même structure par construction : Dictionary<P> impose la parité des clés. Sonar ignore les littéraux et signale toujours le fichier (D61).
sonar.cpd.exclusions=src/lib/i18n/ui-messages.ts
