name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Envoi à Codecov par OIDC (F42), sans jeton à stocker.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : Sonar en a besoin pour attribuer le nouveau code (blame).
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Dépendances entre dossiers
        run: pnpm deps
      - name: Types
        run: pnpm typecheck
      - name: Tests (avec couverture)
        run: pnpm test:coverage
      - name: Envoyer la couverture à Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
      # Avant le build : le scanner ne doit pas analyser dist/. Une PR venue d'un fork n'a pas accès
      # à SONAR_TOKEN : l'analyse est sautée (le mainteneur la relance depuis une branche du dépôt).
      - name: Analyse SonarQube Cloud
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Vérifier l'animation du README
        run: pnpm check:hero
      - name: Build
        run: pnpm build
      - name: Build de la doc
        run: pnpm docs:build
      - name: Vérifier que Recharts et write-excel-file restent hors du bundle initial
        run: pnpm check:bundle
      - name: Vérifier que tout le build est pré-caché par le service worker
        run: pnpm check:precache
      - name: Vérifier les budgets de taille du build (accueil et chunks)
        run: pnpm check:budget
      - name: Vérifier que l'arbre de routes est à jour
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Vérifier la base des assets
        run: grep -q '/questionator-z4000-hyperdrive/assets/' dist/index.html
      - name: Vérifier la base des assets de la doc
        run: grep -q '/questionator-z4000-hyperdrive/docs/assets/' dist/docs/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version de Playwright
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          [[ -n "$version" && "$version" != null ]] || { echo "version Playwright introuvable" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
